# Пример конфигурации md_sorter.
#
# Файл ищется в корне хранилища под именем md_sorter.toml или .md_sorter.toml.
# Любой параметр можно переопределить аргументом командной строки — CLI важнее.
# Все параметры необязательны: программа работает и без этого файла.

[md_sorter]
# --- пути --------------------------------------------------------------------
# inbox   — каталог с несортированными заметками.
# vault   — корень хранилища, откуда берётся структура категорий.
#           Для схемы «ХРАНИЛИЩЕ/INBOX» это каталог на уровень выше inbox.
# output  — куда складывать результат (по умолчанию <inbox>/Sorted_md_files).
#
# Проще всего не писать их руками:
#   python sorter.py --vault .. --save-config
# inbox = "/sdcard/MAIN_OBSIDIAN_PC/INBOX"
# vault = "/sdcard/MAIN_OBSIDIAN_PC"
# output = "/sdcard/MAIN_OBSIDIAN_PC/INBOX/Sorted_md_files"

# --- классификация -----------------------------------------------------------
# Минимальная оценка для уверенного решения (0..1).
threshold = 0.22

# Относительное правило приёма: лидер должен обойти ближайшего несвязанного
# соперника хотя бы во столько раз и набрать не меньше min_evidence.
# Именно оно позволяет узнавать личные категории, которых нет во встроенном
# словаре: у них абсолютные оценки всегда низкие.
dominance = 1.5
min_evidence = 0.05

# Минимальный отрыв лидера от соперника; иначе решение считается спорным.
margin = 0.06

# Что делать с сомнительными заметками: review | best | ancestor | root | skip
# best — раскладывать всё, у чего есть хоть какой-то сигнал.
uncertain_strategy = "review"

# Обучение на самом хранилище.
knn_neighbors = 5          # сколько разложенных соседей голосует
knn_min_support = 3        # заметок в категории для полного веса её голоса
self_training_rounds = 1   # проходов дообучения на уверенных решениях (0 — выкл.)
self_training_min_score = 0.10

# Алгоритм: lexical (по умолчанию, без зависимостей) | tfidf | embeddings | llm | hybrid
classifier = "lexical"

# Модель для --classifier embeddings.
embedding_model = "paraphrase-multilingual-MiniLM-L12-v2"

# Модель для --classifier llm.
llm_model = "claude-opus-5"

# Сколько вариантов показывать в --verbose.
top_candidates = 3

# --- сканирование ------------------------------------------------------------
ignored_directories = [
    "Sorted_md_files", ".git", ".obsidian", ".trash", "node_modules", "__pycache__",
]
include_hidden = false
follow_symlinks = false
max_file_size = 5242880      # 5 МБ
max_analysis_chars = 40000
jobs = 1                     # 0 — выбрать число процессов автоматически

# --- запись ------------------------------------------------------------------
dry_run = false
copy_mode = "copy"           # "move" дополнительно требует --allow-move
manifest = false             # вести Sorted_md_files/.md_sorter_manifest.json

# Убирать из результата папки, в которые не попало ни одного файла.
# Удаление ограничено каталогом результата и только пустыми папками.
prune_empty = true

# --- собственные термины категорий -------------------------------------------
# Ключ — путь категории относительно корня, значение — характерные для неё слова.
# Это основной способ подстроить классификацию под своё хранилище без правки кода.
[md_sorter.aliases]
"Linux/Termux" = ["термукс", "телефон", "pkg", "proot"]
"Games/ULTRAKILL" = ["hakita", "ранг", "стиль", "слой"]
"Hobby/Moto" = ["мотоцикл", "цепь", "масло", "пробег"]

# --- тонкая настройка весов (менять редко) -----------------------------------
[md_sorter.weights]
filename = 3.0
inline_tags = 3.0
title = 2.5
code_language = 2.5
body = 1.0
parent_support = 0.35
depth_bonus = 0.06
source_path_prior = 0.10
